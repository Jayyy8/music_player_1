workflows:
  ios-unsigned-sideload:
    name: iOS Unsigned Build (Free Sideload via AltStore/SideStore)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Build unsigned iOS app
        script: |
          flutter build ios --release --no-codesign
      - name: Package into unsigned .ipa
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r music_player.ipa Payload
    artifacts:
      - build/ios/iphoneos/music_player.ipa